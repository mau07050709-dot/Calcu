[platformio]
default_envs = native

[env:native]
platform = native
build_flags = -std=c++17
build_src_filter = +<core/> +<sim/>
test_build_src = yes
test_framework = custom

; Perfil provisional de compilacion para el ESP32 clasico.
; Sustituir board por el ID de la placa confirmada antes de cargar.
[env:esp32]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = +<core/> +<esp32/>
lib_deps =
    bblanchon/ArduinoJson@7.4.2
